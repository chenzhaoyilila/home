<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Notes · Zhaoyi Chen" data-zh="随笔 · Zhaoyi Chen" data-de="Notizen · Zhaoyi Chen">Notes · Zhaoyi Chen</title>
  <link rel="stylesheet" href="assets/industry.css">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script src="assets/turn.js"></script>
<div class="shell">
  <a class="spine" href="index.html" aria-label="Zhaoyi Chen — contents"><span>Zhaoyi Chen</span></a>
  <div class="page">
    <div class="topbar">
      <a class="btn btn-ghost back" href="index.html#notes">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        <span data-en="Notes" data-zh="随笔" data-de="Notizen">Notes</span>
      </a>
      <div class="topbar-tools">
        <!-- Shown only in your own browser, once it is connected on write.html -->
        <a class="btn btn-secondary owner-btn" id="edit-note" href="write.html" data-owner hidden>
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>
          <span data-en="Edit" data-zh="编辑" data-de="Bearbeiten">Edit</span>
        </a>
        <div class="seg lang" role="radiogroup" aria-label="Language / 语言 / Sprache">
          <label class="seg-opt"><input type="radio" name="lang-top" value="en" data-lang>EN</label>
          <label class="seg-opt"><input type="radio" name="lang-top" value="zh" data-lang>中</label>
          <label class="seg-opt"><input type="radio" name="lang-top" value="de" data-lang>DE</label>
        </div>
      </div>
    </div>
    <article class="article" id="article"><p class="status" data-en="Loading…" data-zh="正在加载…" data-de="Wird geladen…">Loading…</p></article>
  </div>
</div>

<script src="assets/site.js"></script>
<script src="assets/interactions.js" defer></script>
<script>
(() => {
  // The post body (bodyHtml in content/posts.json) is shown exactly as written; only the page chrome translates.
  const MSG = {
    none: ['No post selected.', '未选择文章。', 'Keine Notiz ausgewählt.'],
    missing: ['This note was not found. Check the slug in content/posts.json.', '未找到该文章。请检查 content/posts.json 中的 slug。',
      'Diese Notiz wurde nicht gefunden. Prüfe den Slug in content/posts.json.'],
    error: ['Could not load the notes. If you opened this file directly, preview it with a local server (e.g. Live Server).', '无法加载随笔。如果你是直接打开的本文件，请改用本地服务器（如 Live Server）预览。',
      'Die Notizen konnten nicht geladen werden. Wenn du diese Datei direkt geöffnet hast, nutze für die Vorschau einen lokalen Server (z. B. Live Server).'],
  };
  const el = document.getElementById('article');
  const editLink = document.getElementById('edit-note');
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  // Drafts exist only in the gitignored preview file, so only ?preview=1 can show them.
  const PREVIEW = params.get('preview') === '1';
  if (PREVIEW) document.querySelector('.back').href = 'index.html?preview=1#notes';
  if (PREVIEW) {
    const banner = document.createElement('div');
    banner.className = 'preview-banner';
    banner.textContent = '预览模式 PREVIEW — 含未发布草稿，仅本地可见 / includes unpublished drafts, local only';
    document.body.appendChild(banner);
  }
  let post = null;
  let state = slug ? 'loading' : 'none';
  let rendered;
  if (window.turn) window.turn.hold(new Promise((r) => { rendered = r; }));

  function render() {
    if (state === 'loading') return;
    if (rendered) rendered();
    if (state !== 'loaded') { editLink.hidden = true; el.innerHTML = `<p class="status">${sitePick(MSG[state])}</p>`; return; }
    editLink.href = `write.html?slug=${encodeURIComponent(post.slug)}`;
    document.title = `${post.title} · Zhaoyi Chen`;
    const tags = (post.tags || []).map((t) => `<span class="tag tag-accent">${siteEscape(t)}</span>`).join('');
    el.innerHTML = `
      ${post.draft ? '<span class="draft-badge">DRAFT 草稿</span>' : ''}
      <span class="kicker">${siteEscape(siteFormatDate(post.date))}</span>
      <h1 class="article-title">${siteEscape(post.title || 'Untitled')}</h1>
      ${tags ? `<div class="post-tags">${tags}</div>` : ''}
      <div class="article-prose">${post.bodyHtml || ''}</div>`;
  }

  document.addEventListener('langchange', render);
  if (!slug) { render(); return; }
  fetch(PREVIEW ? 'content/posts.preview.json' : 'content/posts.json', { cache: 'no-cache' })
    .then((r) => { if (!r.ok) throw new Error('fetch failed'); return r.json(); })
    .then((data) => {
      post = (data.posts || []).find((p) => p.slug === slug) || null;
      state = post ? 'loaded' : 'missing';
      render();
    })
    .catch(() => { state = 'error'; render(); });
})();
</script>
</body>
</html>
